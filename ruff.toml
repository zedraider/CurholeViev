# Конфигурация Ruff для CI (ruff check . / ruff format --check .)

[lint]
extend-select = ["N", "S", "B", "BLE", "SIM", "UP"]

ignore = [
    # Имя пакета совпадает с названием репозитория на GitHub (CurholeViev).
    # Переименование ломает импорт и историю проекта, поэтому N999 отключён точечно.
    "N999",
    # S101 (assert) разрешён в тестах — это стандартный инструмент pytest.
    "S101",
    # S311: random.random() используется для моделирования вероятностей
    # в симуляторе, а не для генерации криптографических ключей.
    "S311",
]

[lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE"]
